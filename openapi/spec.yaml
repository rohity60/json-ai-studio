# JSON AI Studio API — Machine-Readable Contract
# Monolithic OpenAPI 3.1 spec at project root (see ADR-0012)
# Generated from PRD v1.0 + backend/frontend requirements
# All shared types live in components/schemas; each endpoint references them.

openapi: "3.1.0"
info:
  title: JSON AI Studio API
  description: |-
    AI-powered configuration management platform — enable developers, product
    managers, and solution architects to create, modify, validate, and manage
    JSON configurations through natural language conversation.
  version: "0.1.0"

securitySchemes:
  simpleApiKey:
    type: apiKey
    in: header
    name: X-API-Key
  bearerAuth:
    type: http
    scheme: bearer
    bearerFormat: JWT
    description: |-
      Auth0 access token (RS256). Optional: anonymous callers use
      simpleApiKey with the shared free quota; logged-in callers get a
      per-user quota persisted in the database (ADR-0015).
servers:
   - url: http://localhost:8000
     description: Local development server

tags:
   - name: sessions
     description: Session lifecycle management
   - name: upload
     description: JSON upload and parsing
   - name: chat
     description: Conversational editing (SSE streaming)
   - name: validate
     description: JSON validation engine
   - name: diff
     description: Diff generation between JSON documents
   - name: export
     description: Export downloaded JSON files
   - name: users
     description: Signed-up user profile + quota (optional Auth0 login)
   - name: workspaces
     description: Persistent workspaces of tagged JSON documents + versions (ADR-0018)

paths:
   # =====================================================================
   # SESSION MANAGEMENT
   # =====================================================================

   /api/sessions:
    post:
      tags: [sessions]
      summary: Create a new session
      description: |-
        Create an empty session and return its ID. The frontend stores this
        ID in localStorage for session recovery across page refreshes.
      operationId: createSession
      security:
         - simpleApiKey: []
         - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
               $ref: '#/components/schemas/CreateSessionRequest'
            example:
              name: "My Configuration"
      responses:
         '201':
          description: Session created successfully
          headers:
            X-Session-Id:
              description: UUID of the newly created session
              schema:
                type: string
          content:
            application/json:
              schema:
                 $ref: '#/components/schemas/SessionResponse'
              example:
                id: "abc123"
                name: "My Configuration"
                working_json: {}
                versions: []
                conversation_history: []
                created_at: "2026-06-21T00:00:00Z"
                updated_at: "2026-06-21T00:00:00Z"
         '400':
           $ref: '#/components/responses/Error400'
         '401':
           $ref: '#/components/responses/Error401'
         '429':
           $ref: '#/components/responses/Error429'
         '500':
           $ref: '#/components/responses/Error500'

   /api/sessions/from-template:
    post:
      tags: [sessions]
      summary: Seed a new session from a static template
      description: |-
        Open-in-Workspace bridge (ADR-0020). Creates a session whose
        working_json is the supplied static template JSON and echoes back the
        starter prompts for the studio's chip UI. Free (no LLM call), counts
        toward the request rate limit only; anonymous callers are allowed.
      operationId: seedSessionFromTemplate
      security:
         - simpleApiKey: []
         - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
               $ref: '#/components/schemas/SeedFromTemplateRequest'
            example:
              templateSlug: "aws-iam-readonly-policy"
              templateTitle: "AWS IAM Read-only Policy"
              json: {"Version": "2012-10-17", "Statement": []}
              starterPrompts: ["Explain each statement", "Restrict to one region"]
      responses:
         '201':
          description: Session created and seeded with template JSON
          content:
            application/json:
              schema:
                 $ref: '#/components/schemas/SessionResponse'
              example:
                id: "abc123"
                name: "AWS IAM Read-only Policy"
                working_json: {"Version": "2012-10-17", "Statement": []}
                versions: []
                conversation_history: []
                starter_prompts: ["Explain each statement"]
                created_at: "2026-07-15T00:00:00Z"
                updated_at: "2026-07-15T00:00:00Z"
         '401':
           $ref: '#/components/responses/Error401'
         '413':
           description: Template JSON exceeds the size limit
         '422':
           description: Invalid template payload (json not an object, etc.)
         '429':
           $ref: '#/components/responses/Error429'
         '500':
           $ref: '#/components/responses/Error500'

   /api/sessions/{sessionId}:
    get:
      tags: [sessions]
      summary: Get session state
      description: |-
        Retrieve the full session state including working JSON, conversation
        history, and version list. Used by the frontend to restore the UI on
        page load or after a client-side refresh.
      operationId: getSession
      security:
         - simpleApiKey: []
         - bearerAuth: []
      parameters:
         - name: sessionId
           in: path
           required: true
           description: UUID of the session to retrieve
           schema:
             type: string
      responses:
         '200':
          description: Session state retrieved
          content:
            application/json:
              schema:
                 $ref: '#/components/schemas/SessionResponse'
         '401':
           $ref: '#/components/responses/Error401'
         '404':
           $ref: '#/components/responses/Error404'
         '429':
           $ref: '#/components/responses/Error429'

   /api/sessions/{sessionId}/chat:
    delete:
      tags: [sessions]
      summary: Clear chat history
      description: |-
        Drop the session's chat thread (LLM context). Refused with 409 while
        any diff is still pending — accept-all / reject-all first.
      operationId: clearChat
      security:
         - simpleApiKey: []
         - bearerAuth: []
      parameters:
         - name: sessionId
           in: path
           required: true
           schema:
             type: string
      responses:
         '204':
          description: Chat history cleared
         '401':
           $ref: '#/components/responses/Error401'
         '404':
           $ref: '#/components/responses/Error404'
         '409':
          description: Pending diffs exist
         '429':
           $ref: '#/components/responses/Error429'

   /api/sessions/{sessionId}/versions:
    get:
      tags: [sessions]
      summary: List all versions for a session
      description: |-
        Return all version snapshots (original, working, approved) with their
        timestamps. Used to populate the version sidebar in the frontend.
      operationId: listVersions
      security:
         - simpleApiKey: []
         - bearerAuth: []
      parameters:
         - name: sessionId
           in: path
           required: true
           description: UUID of the session
           schema:
             type: string
      responses:
         '200':
          description: Version list retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  versions:
                    type: array
                    items:
                       $ref: '#/components/schemas/VersionSnapshot'
                required: [versions]
              example:
                versions:
                   - id: "v1"
                     parent_id: null
                     json_data: {}
                     label: "original"
                     created_at: "2026-06-21T00:00:00Z"
         '401':
           $ref: '#/components/responses/Error401'
         '404':
           $ref: '#/components/responses/Error404'
         '429':
           $ref: '#/components/responses/Error429'

    post:
      tags: [sessions]
      summary: Create a version snapshot
      description: |-
        Take a named snapshot of the current working JSON. Each snapshot is an
        immutable point-in-time state that can be restored later.
      operationId: createVersionSnapshot
      security:
         - simpleApiKey: []
         - bearerAuth: []
      parameters:
         - name: sessionId
           in: path
           required: true
           description: UUID of the session
           schema:
             type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
               $ref: '#/components/schemas/CreateVersionRequest'
            example:
              label: "v1 — increase timeout"
              json_data:
                services:
                  api:
                    timeout: 60
      responses:
         '201':
          description: Version snapshot created
          content:
            application/json:
              schema:
                 $ref: '#/components/schemas/VersionSnapshot'
              example:
                id: "v2"
                parent_id: "v1"
                json_data: {}
                label: "v1 — increase timeout"
                created_at: "2026-06-21T00:01:00Z"
         '401':
           $ref: '#/components/responses/Error401'
         '404':
           $ref: '#/components/responses/Error404'
         '429':
           $ref: '#/components/responses/Error429'

   /api/sessions/{sessionId}/versions/select:
    post:
      tags: [sessions]
      summary: Select a version snapshot as the working baseline
      description: |-
        Load a version snapshot into the session: both working_json and
        baseline_json are reset to the snapshot's json_data (deep copies)
        and the conversation history is cleared.
      operationId: selectVersion
      security:
         - simpleApiKey: []
         - bearerAuth: []
      parameters:
         - name: sessionId
           in: path
           required: true
           description: UUID of the session
           schema:
             type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
               $ref: '#/components/schemas/SelectVersionRequest'
            example:
              versionId: "v2"
      responses:
         '200':
          description: Version selected; session state reset to the snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  working_json:
                    type: object
                    additionalProperties: true
                  baseline_json:
                    type: object
                    additionalProperties: true
                  active_version_id:
                    type: string
                    nullable: true
                  versions:
                    type: array
                    items:
                       $ref: '#/components/schemas/VersionSnapshot'
                  conversation_history:
                    type: array
                    items:
                       $ref: '#/components/schemas/ChatTurn'
                required: [working_json, baseline_json, versions]
         '401':
           $ref: '#/components/responses/Error401'
         '404':
           $ref: '#/components/responses/Error404'
         '429':
           $ref: '#/components/responses/Error429'

   /api/sessions/{sessionId}/versions/restore:
    post:
      tags: [sessions]
      summary: Bulk-restore version snapshots into an empty session
      description: |-
        Restore previously saved version snapshots (e.g. from the browser's
        IndexedDB cache) into a freshly created session after a backend
        restart. Snapshot ids, labels, parent chains, and timestamps are
        preserved verbatim. Only allowed when the session has no versions
        yet — otherwise responds 409 so client retries are safe.
      operationId: restoreVersions
      security:
         - simpleApiKey: []
         - bearerAuth: []
      parameters:
         - name: sessionId
           in: path
           required: true
           description: UUID of the session to restore into
           schema:
             type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
               $ref: '#/components/schemas/RestoreVersionsRequest'
            example:
              versions:
                 - id: "v1"
                   parent_id: null
                   json_data: {"services": {"api": {"timeout": 30}}}
                   label: "original"
                   created_at: "2026-07-01T00:00:00Z"
              working_json: {"services": {"api": {"timeout": 60}}}
              active_version_id: "v1"
      responses:
         '200':
          description: Versions restored; full session state returned
          content:
            application/json:
              schema:
                 $ref: '#/components/schemas/SessionResponse'
         '400':
           $ref: '#/components/responses/Error400'
         '401':
           $ref: '#/components/responses/Error401'
         '404':
           $ref: '#/components/responses/Error404'
         '409':
           $ref: '#/components/responses/Error409'
         '429':
           $ref: '#/components/responses/Error429'

   /api/sessions/{sessionId}/diffs/{diffId}/accept:
    post:
      tags: [sessions]
      summary: Apply an approved diff to the working JSON
      description: |-
        Merge the specified diff into the session's working_json. The diff is
        marked as accepted and the updated state becomes the new baseline for
        subsequent chat turns. An automatic validation run is triggered after
        acceptance; if validation fails, a warning toast is shown to the user
        but the diff remains applied.
      operationId: acceptDiff
      security:
         - simpleApiKey: []
         - bearerAuth: []
      parameters:
         - name: sessionId
           in: path
           required: true
           description: UUID of the session
           schema:
             type: string
         - name: diffId
           in: path
           required: true
           description: UUID of the diff to accept
           schema:
             type: string
      responses:
         '200':
          description: Diff applied successfully
          content:
            application/json:
              schema:
                 $ref: '#/components/schemas/DiffAcceptResponse'
              example:
                success: true
                working_json: {}
                validation_passed: true
         '401':
           $ref: '#/components/responses/Error401'
         '404':
           $ref: '#/components/responses/Error404'
         '429':
           $ref: '#/components/responses/Error429'

   /api/sessions/{sessionId}/diffs/{diffId}/reject:
    post:
      tags: [sessions]
      summary: Revert a rejected diff from the working JSON
      description: |-
        Remove the specified diff from the working JSON. The diff is marked as
        rejected and does not affect the baseline state.
      operationId: rejectDiff
      security:
         - simpleApiKey: []
         - bearerAuth: []
      parameters:
         - name: sessionId
           in: path
           required: true
           description: UUID of the session
           schema:
             type: string
         - name: diffId
           in: path
           required: true
           description: UUID of the diff to reject
           schema:
             type: string
      responses:
         '200':
          description: Diff rejected successfully
          content:
            application/json:
              schema:
                 $ref: '#/components/schemas/DiffRejectResponse'
              example:
                success: true
                working_json: {}
         '401':
           $ref: '#/components/responses/Error401'
         '404':
           $ref: '#/components/responses/Error404'
         '429':
           $ref: '#/components/responses/Error429'

   # =====================================================================
   # JSON UPLOAD & PARSING
   # =====================================================================

   /api/sessions/{sessionId}/diffs/accept-all:
    post:
      tags: [sessions]
      summary: Accept all pending diffs (optionally one review batch)
      description: |-
        Without parameters: promote every pending diff into baseline_json.
        With job_id (and optionally batch_no): accept only the pending diffs
        of that review job / batch (ADR-0026); other pending diffs stay.
      operationId: acceptAllDiffs
      security:
         - simpleApiKey: []
         - bearerAuth: []
      parameters:
         - name: sessionId
           in: path
           required: true
           schema:
             type: string
         - name: job_id
           in: query
           required: false
           description: Only diffs produced by this review job
           schema:
             type: string
         - name: batch_no
           in: query
           required: false
           description: Only diffs of this batch (needs job_id)
           schema:
             type: integer
      responses:
         '200':
          description: Diffs accepted
          content:
            application/json:
              schema:
                 $ref: '#/components/schemas/DiffAcceptResponse'
         '401':
           $ref: '#/components/responses/Error401'
         '404':
           $ref: '#/components/responses/Error404'
         '429':
           $ref: '#/components/responses/Error429'

   /api/sessions/{sessionId}/diffs/reject-all:
    post:
      tags: [sessions]
      summary: Reject all pending diffs (optionally one review batch)
      description: |-
        Without parameters: revert working_json to baseline_json and mark
        every pending diff rejected. With job_id (and optionally batch_no):
        revert only that review job's / batch's pending diffs (ADR-0026).
      operationId: rejectAllDiffs
      security:
         - simpleApiKey: []
         - bearerAuth: []
      parameters:
         - name: sessionId
           in: path
           required: true
           schema:
             type: string
         - name: job_id
           in: query
           required: false
           schema:
             type: string
         - name: batch_no
           in: query
           required: false
           schema:
             type: integer
      responses:
         '200':
          description: Diffs rejected
          content:
            application/json:
              schema:
                 $ref: '#/components/schemas/DiffRejectResponse'
         '401':
           $ref: '#/components/responses/Error401'
         '404':
           $ref: '#/components/responses/Error404'
         '429':
           $ref: '#/components/responses/Error429'

   # =====================================================================
   # REVIEW JOBS (ADR-0026) — client-driven batches
   # =====================================================================

   /api/sessions/{sessionId}/jobs:
    post:
      tags: [jobs]
      summary: Create a whole-document review job
      description: |-
        Creates a batch review job over the members of scope_path (plus long
        text fields outside it). The job does nothing by itself: the client
        asks for one batch at a time with POST .../jobs/{jobId}/next, so
        closing the tab pauses it. Job state is kept in memory with the
        session and is lost when the backend restarts. One active
        (ready/running/failed) job per session.
      operationId: createJob
      security:
         - simpleApiKey: []
         - bearerAuth: []
      parameters:
         - name: sessionId
           in: path
           required: true
           schema:
             type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
               $ref: '#/components/schemas/CreateJobRequest'
      responses:
         '201':
          description: Job created (status ready, cursor 0)
          content:
            application/json:
              schema:
                 $ref: '#/components/schemas/Job'
         '400':
           $ref: '#/components/responses/Error400'
         '401':
           $ref: '#/components/responses/Error401'
         '404':
           $ref: '#/components/responses/Error404'
         '409':
          description: The session already has an active job (detail.error = "job_active", detail.job_id)
         '429':
           $ref: '#/components/responses/Error429'

   /api/sessions/{sessionId}/jobs/{jobId}:
    get:
      tags: [jobs]
      summary: Job status, cursor and per-batch summaries
      operationId: getJob
      security:
         - simpleApiKey: []
         - bearerAuth: []
      parameters:
         - name: sessionId
           in: path
           required: true
           schema:
             type: string
         - name: jobId
           in: path
           required: true
           schema:
             type: string
      responses:
         '200':
          description: The job
          content:
            application/json:
              schema:
                 $ref: '#/components/schemas/Job'
         '401':
           $ref: '#/components/responses/Error401'
         '404':
           $ref: '#/components/responses/Error404'
    delete:
      tags: [jobs]
      summary: Cancel a job
      description: |-
        Marks the job cancelled. Diffs it already produced stay pending and
        are accepted or rejected as usual.
      operationId: cancelJob
      security:
         - simpleApiKey: []
         - bearerAuth: []
      parameters:
         - name: sessionId
           in: path
           required: true
           schema:
             type: string
         - name: jobId
           in: path
           required: true
           schema:
             type: string
      responses:
         '200':
          description: The cancelled job
          content:
            application/json:
              schema:
                 $ref: '#/components/schemas/Job'
         '401':
           $ref: '#/components/responses/Error401'
         '404':
           $ref: '#/components/responses/Error404'
         '409':
          description: A batch is in flight (detail.error = "job_running"); cancel after it ends

   /api/sessions/{sessionId}/jobs/{jobId}/next:
    post:
      tags: [jobs]
      summary: Process exactly one batch; stream SSE
      description: |-
        Packs the next batch from the job's cursor, makes ONE lean model call
        (job instruction + output contract + that batch's records with their
        JSON Pointer paths — no skeleton, no chat history, no tools), applies
        the diffs as pending (tagged job_id, batch_no) and advances the
        cursor. On a failed job it retries the failed batch.

        Batch size is computed per call from the AI deployment that serves
        it — per-minute token budget, context window, output cap — and each
        record's token size; a record larger than one batch is sent in
        pieces (its long strings in pages) over several batches.

        The call shares the deployment budget and the caller's credit/quota
        checks with /api/chat. Events:
          - deployment, plan, progress, waiting, retrying, usage — as in
            /api/chat.
          - "draft" — raw model text while it streams (keep-alive; ignore).
          - "diff" — one per applied change. data: {"entry": DiffEntry}
          - "batch_complete" — terminal, the batch is stored.
            data: {"batch_no":3,"range":[24,35],"diffs":[DiffEntry],
                   "cursor":36,"total":876,"eta_s":1920,"explanation":"...",
                   "working_json":{...},"turn":ChatTurn,"job":Job}
            range = first and last item index (0-based, inclusive). diffs
            holds applied (pending) and failed entries. job.status is
            "done" after the last batch.
          - "batch_failed" — terminal, the cursor did not move.
            data: {"batch_no":3,"error":"...","retryable":true,"job":Job}
            job.status is "failed"; calling /next again retries the batch.
          - rate_limit / credit_limit — terminal quota stop as in
            /api/chat; the cursor did not move and the job stays "ready".
      operationId: nextJobBatch
      security:
         - simpleApiKey: []
         - bearerAuth: []
      parameters:
         - name: sessionId
           in: path
           required: true
           schema:
             type: string
         - name: jobId
           in: path
           required: true
           schema:
             type: string
      responses:
         '200':
          description: SSE stream ending in batch_complete, batch_failed or a quota event
          content:
            text/event-stream:
              schema:
                type: string
         '401':
           $ref: '#/components/responses/Error401'
         '404':
           $ref: '#/components/responses/Error404'
         '409':
          description: |-
            detail.error = "job_running" (a batch is already in flight) or
            "job_finished" (status done or cancelled).
         '429':
           $ref: '#/components/responses/Error429'

   /api/json/upload:
    post:
      tags: [upload]
      summary: Upload or paste JSON for parsing
      description: |-
        Accept a .json file upload or raw JSON body. Parse the input, validate
        syntax, generate a schema summary (top-level keys, nested depth, array
        lengths), and return the structured tree along with session metadata.
        The response includes a sessionId that the frontend uses for all
        subsequent chat operations.
      operationId: uploadJson
      security:
         - simpleApiKey: []
         - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: .json file to upload (max 20 MB)
                json_body:
                  type: string
                  description: Raw JSON string to parse as an alternative to file upload
              oneOf:
                 - required: [file]
                 - required: [json_body]
          application/json:
            schema:
              type: object
              properties:
                json_body:
                  type: string
                  description: Raw JSON string to parse
            example:
              json_body: '{"services": {"api": {"timeout": 30}}}'
      responses:
         '200':
          description: JSON parsed successfully
          content:
            application/json:
              schema:
                 $ref: '#/components/schemas/UploadResponse'
              example:
                session_id: "abc123"
                parsed_json:
                  services:
                    api:
                      timeout: 30
                schema_summary:
                  top_level_keys: ["services"]
                  nested_depth: 3
                  array_lengths: {}
         '400':
           $ref: '#/components/responses/Error400'
         '401':
           $ref: '#/components/responses/Error401'
         '413':
          description: Payload too large — file exceeds 20 MB limit
          content:
            application/json:
              schema:
                 $ref: '#/components/schemas/Error'
              example:
                error: "File size exceeds 20 MB limit"
                hint: "Please reduce the file size and try again."
         '429':
           $ref: '#/components/responses/Error429'

   # =====================================================================
   # CHAT (SSE STREAMING)
   # =====================================================================

   /api/chat:
    post:
      tags: [chat]
      summary: Send a chat turn; stream SSE response
      description: |-
        Process a natural language message against the current working JSON.
        Returns an SSE stream with three event types in sequence: (1) thinking
          — LLM reasoning text shown inline in the chat, (2) diff(s) — individual
        change entries from the LLM, and (3) complete — final applied state with
        a summary explanation. The frontend accumulates all events and updates
        the working JSON preview panel on the complete event.

        Quota errors never break the stream. When the caller is over a limit
        the stream emits a single terminal event instead:
          - "rate_limit"  — per-minute token cap hit.
            data: {"scope":"model","message":"...","retry_after":60,"login_available":true}
          - "credit_limit" — monthly credits exhausted.
            data: {"scope":"model","message":"...","retry_after":null,"login_available":true}
        login_available is true only for anonymous callers (logging in raises
        the free-tier limits, ADR-0015).

        scope says whose limit was hit: "user" = the caller's own quota
        (ADR-0015); "model" = the AI deployment's per-minute capacity
        (ADR-0025) — login_available is always false for "model". A "model"
        rate_limit is emitted before the provider is called, or when the
        provider itself returns 429 (retry_after = provider retry delay).

        Deployment budget events (ADR-0025). Token counts are never sent:
          - "waiting" — non-terminal; the turn waits, then continues. Repeats
            at least every 5 s as the countdown updates. reason: "pacing"
            (spacing calls), "tokens" (per-minute limit used up) or
            "cooldown" (backing off after a provider error); step = the
            turn step it belongs to (omitted outside a tool loop).
            data: {"retry_after":8,"reason":"tokens","step":2,
                   "message":"This AI model's per-minute limit is used up — continuing shortly"}

        Turn progress events (PRD B §8). Non-terminal and additive — clients
        may ignore them. Messages are built server-side from the plan, tool
        results and sizes (never by the model) and contain only JSON paths,
        sizes, counts and shortened user search terms — never document values:
          - "plan" — once, before the first model call.
            data: {"mode":"skeleton","rounds_planned":4,"steps":5,
                   "calls_per_min":2.1,"eta_s":116,"eta_max_s":228,
                   "message":"Large document — ..."}
            mode "inline" = one call (steps 1). calls_per_min null when the
            deployment has no limits. eta_max_s = eta_s + the time one call
            may spend on the deployment policy's transient retries.
          - "progress" — at each stage change.
            data: {"stage":"calling","step":2,"steps":5,
                   "message":"Step 2/5 — asking the AI model"}
            stage: calling | answering (final step) | applying (diffs being
            applied; no step fields).
          - "tool" — after each lookup (see example); message describes the
            finished lookup, e.g. "Read /data/description (first 3,800 of
            7,485 characters)". Adds step, steps, message to round, name,
            args, result_chars.
          - "retrying" — the server retries a failed model call.
            data: {"attempt":1,"max":3,"wait_s":3.0,"kind":"provider_error",
                   "message":"The AI provider had a temporary error — retrying (1/3)"}
            kind: provider_error | rate_limit. Followed by waiting(reason=cooldown).
          - "input_too_large" — terminal; the request cannot fit the current
            model even as a skeleton. Nothing was sent to the
            model and no credits were used.
            data: {"message":"...","doc_kb":180,"max_kb":40,
                   "sections":[{"path":"/settings","kb":12}],
                   "trimmed":{"working_json":{...},"cuts":[{"path":"/records","from":1240,"to":25,"kind":"array"}]}}
            sections = paths that fit (resend with focus_path); trimmed = a
            structure-preserving copy that fits, offered as a download (null
            when no trim fits). cuts kinds: array/keys {from,to}, string
            {count,to}.
          - "service_unavailable" — provider outage (not rate limits).
            data: {"scope":"model","message":"...","retry_after":30}

        Whole-document review (ADR-0026). A request to review or repair the
        whole document (or a whole collection) that does not fit one planned
        turn is not sent to the model. The stream is thinking → job_proposal
        → complete; the complete explanation states the same numbers:
          - "job_proposal" — what the review would cost as a batch job.
            data: {"scope_path":"/entries","record_count":876,"batch_count":35,
                   "est_tokens":412000,"eta_s":2400,"instruction":"..."}
            (schema JobProposal). The client offers to start the job
            (POST /api/sessions/{id}/jobs). Nothing is charged.

        While a review batch is in flight (job status "running") a message
        that is not a question is refused before the stream starts with
        HTTP 409, detail {"error":"job_running","hint":"..."}; questions
        are answered. Between batches chat edits are allowed.
      operationId: sendChatTurn
      security:
         - simpleApiKey: []
         - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
               $ref: '#/components/schemas/ChatRequest'
            examples:
              simple_modification:
                summary: Increase a single timeout value
                value:
                  session_id: "abc123"
                  conversation_history: []
                  working_json:
                    services:
                      api:
                        timeout: 30
                  message: "Increase timeout to 60 for all services."
              conditional_modification:
                summary: Exclude specific services from a bulk change
                value:
                  session_id: "abc123"
                  conversation_history:
                     - role: user
                       content: "Add retry count of 5"
                  working_json:
                    services:
                      api:
                        timeout: 30
                      payment:
                        timeout: 30
                  message: "Exclude payment services."
      responses:
         '200':
          description: SSE stream — thinking → diff(s) → complete
          content:
            text/event-stream:
              schema:
                type: string
                description: |-
                  Raw SSE wire format. Each event is a block of two lines:
                   "event: <type>\ndata: <json_body>\n\n"
              example: |
                event: plan
                data: {"mode":"skeleton","rounds_planned":4,"steps":5,"calls_per_min":null,"eta_s":20,"eta_max_s":27,"message":"Large document — the AI will look things up in up to 5 steps."}

                event: progress
                data: {"stage":"calling","step":1,"steps":5,"message":"Step 1/5 — asking the AI model"}

                event: thinking
                data: {"text":"Applying timeout change to all services..."}

                event: diff
                data: {"entry":{"id":"d1","path":"/services/api/timeout","operation":"modify","old_value":30,"new_value":60,"status":"pending"}}

                event: diff
                data: {"entry":{"id":"d2","path":"/services/payment/timeout","operation":"modify","old_value":30,"new_value":60,"status":"pending"}}

                event: tool
                data: {"round":1,"step":1,"steps":5,"name":"search","args":"{\"query\":\"timeout\"}","result_chars":812,"message":"Searched values for “timeout” — 2 matches"}

                event: complete
                data: {"working_json":{"services":{"api":{"timeout":60},"payment":{"timeout":60}}},"explanation":"Done — 2 changes applied.","user_turn_id":"u1","assistant_turn_id":"a1"}
         '401':
           $ref: '#/components/responses/Error401'
         '429':
           $ref: '#/components/responses/Error429'
         '500':
           $ref: '#/components/responses/Error500'

   # =====================================================================
   # VALIDATION ENGINE
   # =====================================================================

   /api/validate:
    post:
      tags: [validate]
      summary: Validate a JSON document
      description: |-
        Run syntax and business rule validation on the provided JSON. Syntax
        validation ensures the input parses as valid JSON. Business rule
        validation checks constraints like timeout > 0, retryCount <= 10, and
        mandatory fields populated. Schema validation (JSON Schema draft-2020-12)
        is deferred to a future phase. Validation runs automatically after each
        approved diff before marking it as final.
      operationId: validateJson
      security:
         - simpleApiKey: []
         - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
               $ref: '#/components/schemas/ValidateRequest'
            examples:
              valid_config:
                summary: A valid configuration document
                value:
                  json_data:
                    services:
                      api:
                        timeout: 60
                        retryCount: 5
              invalid_config:
                summary: An invalid configuration (timeout = -1)
                value:
                  json_data:
                    services:
                      api:
                        timeout: -1
      responses:
         '200':
          description: Validation result
          content:
            application/json:
              schema:
                 $ref: '#/components/schemas/ValidateResponse'
              examples:
                valid:
                  summary: All rules pass
                  value:
                    valid: true
                    errors: []
                invalid:
                  summary: Business rule violation (timeout <= 0)
                  value:
                    valid: false
                    errors:
                       - path: "/services/api/timeout"
                         message: "timeout must be greater than 0"
         '400':
           $ref: '#/components/responses/Error400'
         '401':
           $ref: '#/components/responses/Error401'
         '429':
           $ref: '#/components/responses/Error429'

   # =====================================================================
   # DIFF GENERATION
   # =====================================================================

   /api/diff:
    post:
      tags: [diff]
      summary: Compute diff between two JSON documents
      description: |-
        Return a structured field-level diff between old and new JSON objects.
        Supports nested objects, arrays, and scalar types. Used by the frontend
        to render the before/after side-by-side comparison view with color-coded
        diff indicators (green for added, orange for modified, red for deleted).
      operationId: computeDiff
      security:
         - simpleApiKey: []
         - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                old_json:
                  type: object
                  additionalProperties: true
                  description: The original JSON state (before)
                new_json:
                  type: object
                  additionalProperties: true
                  description: The modified JSON state (after)
              required: [old_json, new_json]
            examples:
              modify_value:
                summary: Modify a single scalar value
                value:
                  old_json:
                    services:
                      api:
                        timeout: 30
                  new_json:
                    services:
                      api:
                        timeout: 60
              add_field:
                summary: Add a new field
                value:
                  old_json:
                    services:
                      api: {}
                  new_json:
                    services:
                      api:
                        timeout: 30
              delete_field:
                summary: Remove an existing field
                value:
                  old_json:
                    services:
                      api:
                        timeout: 30
                  new_json:
                    services:
                      api: {}
      responses:
         '200':
          description: Structured diff between two JSON documents
          content:
            application/json:
              schema:
                type: object
                properties:
                  diffs:
                    type: array
                    items:
                       $ref: '#/components/schemas/DiffEntry'
                    description: List of field-level changes
                required: [diffs]
              example:
                diffs:
                   - path: "/services/api/timeout"
                     operation: "modify"
                     old_value: 30
                     new_value: 60
         '400':
           $ref: '#/components/responses/Error400'
         '401':
           $ref: '#/components/responses/Error401'
         '429':
           $ref: '#/components/responses/Error429'

   # =====================================================================
   # EXPORT
   # =====================================================================

   /api/sessions/{sessionId}/export:
    get:
      tags: [export]
      summary: Download JSON file for a session
      description: |-
        Return the current working JSON as a downloadable file. Default format
        is pretty-printed; add ?format=minified for compact output. Used by the
        frontend's export button to save the final approved configuration.
      operationId: exportSessionJson
      security:
         - simpleApiKey: []
         - bearerAuth: []
      parameters:
         - name: sessionId
           in: path
           required: true
           description: UUID of the session to export
           schema:
             type: string
         - name: format
           in: query
           required: false
           description: Output format — pretty (default) or minified
           schema:
             type: string
             enum: [pretty, minified]
             default: pretty
      responses:
         '200':
          description: JSON file content
          headers:
            Content-Disposition:
              description: Filename for the downloaded file
              schema:
                type: string
                example: 'attachment; filename="session-export.json"'
            Content-Type:
              description: Always application/json
              schema:
                type: string
                example: "application/json"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
         '401':
           $ref: '#/components/responses/Error401'
         '404':
           $ref: '#/components/responses/Error404'
         '429':
           $ref: '#/components/responses/Error429'

   # =====================================================================
   # USERS (optional Auth0 login, ADR-0015)
   # =====================================================================

   /api/me:
    get:
      tags: [users]
      summary: Get the logged-in user's profile and credit quota
      description: |-
        Requires an Auth0 bearer token. Anonymous callers (X-API-Key only)
        receive 401. The user row is provisioned automatically on the first
        authenticated request; email/name/picture are backfilled from the
        Auth0 /userinfo endpoint.
      operationId: getMe
      security:
         - bearerAuth: []
      responses:
         '200':
          description: Profile + credit quota for the logged-in user
          content:
            application/json:
              schema:
                 $ref: '#/components/schemas/UserProfile'
              example:
                id: "7f9b0d2c-3f60-4f9e-9a5b-2f1e8c7d6a54"
                email: "dev@example.com"
                name: "Dev Example"
                picture: "https://s.gravatar.com/avatar/x.png"
                plan: "free"
                credits:
                  monthly_limit: 2000
                  used: 12.5
                  remaining: 1987.5
                  billing_cycle_start: "2026-07-08T00:00:00"
                per_minute_token_limit: 30000
         '401':
           $ref: '#/components/responses/Error401'
         '429':
           $ref: '#/components/responses/Error429'
         '503':
          description: Login temporarily unavailable (auth/database not configured)
          content:
            application/json:
              schema:
                 $ref: '#/components/schemas/Error'

   # =====================================================================
   # WORKSPACES (ADR-0018) — bearer-only persistence layer
   # =====================================================================

   /api/workspaces:
    get:
      tags: [workspaces]
      summary: List the caller's workspaces
      description: |-
        All workspaces owned by the logged-in user, with document counts.
        Anonymous callers get 401 with login_available true.
      operationId: listWorkspaces
      security:
         - bearerAuth: []
      responses:
         '200':
          description: Workspaces owned by the caller
          content:
            application/json:
              schema:
                type: array
                items:
                   $ref: '#/components/schemas/WorkspaceSummary'
         '401':
           $ref: '#/components/responses/Error401Login'
         '503':
           $ref: '#/components/responses/Error503'
    post:
      tags: [workspaces]
      summary: Create a workspace
      operationId: createWorkspace
      security:
         - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
               $ref: '#/components/schemas/CreateWorkspaceRequest'
      responses:
         '201':
          description: Workspace created
          content:
            application/json:
              schema:
                 $ref: '#/components/schemas/WorkspaceSummary'
         '401':
           $ref: '#/components/responses/Error401Login'
         '409':
           $ref: '#/components/responses/Error409Workspace'
         '503':
           $ref: '#/components/responses/Error503'

   /api/workspaces/{workspaceId}:
    parameters:
       - name: workspaceId
         in: path
         required: true
         schema:
           type: string
    patch:
      tags: [workspaces]
      summary: Rename a workspace
      operationId: renameWorkspace
      security:
         - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
               $ref: '#/components/schemas/CreateWorkspaceRequest'
      responses:
         '200':
          description: Workspace renamed
          content:
            application/json:
              schema:
                 $ref: '#/components/schemas/WorkspaceSummary'
         '401':
           $ref: '#/components/responses/Error401Login'
         '404':
           $ref: '#/components/responses/Error404'
         '409':
           $ref: '#/components/responses/Error409Workspace'
    delete:
      tags: [workspaces]
      summary: Delete a workspace and everything in it
      description: The default workspace cannot be deleted (409).
      operationId: deleteWorkspace
      security:
         - bearerAuth: []
      responses:
         '204':
          description: Workspace deleted (documents + versions cascade)
         '401':
           $ref: '#/components/responses/Error401Login'
         '404':
           $ref: '#/components/responses/Error404'
         '409':
           $ref: '#/components/responses/Error409Workspace'

   /api/workspaces/{workspaceId}/jsons:
    parameters:
       - name: workspaceId
         in: path
         required: true
         schema:
           type: string
    get:
      tags: [workspaces]
      summary: List JSON documents in a workspace
      operationId: listWorkspaceJsons
      security:
         - bearerAuth: []
      responses:
         '200':
          description: Documents in the workspace
          content:
            application/json:
              schema:
                type: array
                items:
                   $ref: '#/components/schemas/JsonDocumentSummary'
         '401':
           $ref: '#/components/responses/Error401Login'
         '404':
           $ref: '#/components/responses/Error404'
    post:
      tags: [workspaces]
      summary: Save a new JSON document (bulk, with versions)
      description: |-
        The Save flow: persists 1..5 versions in one transaction. 409 when
        the workspace already holds the maximum number of documents or the
        tag is taken.
      operationId: saveWorkspaceJson
      security:
         - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
               $ref: '#/components/schemas/SaveJsonRequest'
      responses:
         '201':
          description: Document + versions saved
          content:
            application/json:
              schema:
                 $ref: '#/components/schemas/JsonDocumentSummary'
         '401':
           $ref: '#/components/responses/Error401Login'
         '404':
           $ref: '#/components/responses/Error404'
         '409':
           $ref: '#/components/responses/Error409Workspace'
         '422':
          description: Payload has 0 versions or more than the version limit

   /api/workspaces/{workspaceId}/jsons/{documentId}:
    parameters:
       - name: workspaceId
         in: path
         required: true
         schema:
           type: string
       - name: documentId
         in: path
         required: true
         schema:
           type: string
    get:
      tags: [workspaces]
      summary: Get a document with all its versions
      description: |-
        Versions are ordered by version_number; the client loads the highest
        one as the working JSON (hydrated through the session restore flow).
      operationId: getWorkspaceJson
      security:
         - bearerAuth: []
      responses:
         '200':
          description: Document detail
          content:
            application/json:
              schema:
                 $ref: '#/components/schemas/JsonDocumentDetail'
         '401':
           $ref: '#/components/responses/Error401Login'
         '404':
           $ref: '#/components/responses/Error404'
    patch:
      tags: [workspaces]
      summary: Rename a document's tag
      operationId: renameWorkspaceJson
      security:
         - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
               $ref: '#/components/schemas/RenameJsonRequest'
      responses:
         '200':
          description: Tag renamed
          content:
            application/json:
              schema:
                 $ref: '#/components/schemas/JsonDocumentSummary'
         '401':
           $ref: '#/components/responses/Error401Login'
         '404':
           $ref: '#/components/responses/Error404'
         '409':
           $ref: '#/components/responses/Error409Workspace'
    delete:
      tags: [workspaces]
      summary: Delete a document and its versions
      operationId: deleteWorkspaceJson
      security:
         - bearerAuth: []
      responses:
         '204':
          description: Document deleted (frees a document slot)
         '401':
           $ref: '#/components/responses/Error401Login'
         '404':
           $ref: '#/components/responses/Error404'

   /api/workspaces/{workspaceId}/jsons/{documentId}/versions:
    parameters:
       - name: workspaceId
         in: path
         required: true
         schema:
           type: string
       - name: documentId
         in: path
         required: true
         schema:
           type: string
    post:
      tags: [workspaces]
      summary: Append versions to an existing document
      description: |-
        The Save flow for an already-persisted document: appends only the
        not-yet-persisted snapshots. Atomic — 409 (nothing written) when the
        append would exceed the version limit.
      operationId: appendJsonVersions
      security:
         - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
               $ref: '#/components/schemas/AppendVersionsRequest'
      responses:
         '201':
          description: Versions appended
          content:
            application/json:
              schema:
                type: array
                items:
                   $ref: '#/components/schemas/WorkspaceJsonVersion'
         '401':
           $ref: '#/components/responses/Error401Login'
         '404':
           $ref: '#/components/responses/Error404'
         '409':
           $ref: '#/components/responses/Error409Workspace'

   /api/workspaces/{workspaceId}/jsons/{documentId}/versions/{versionId}:
    parameters:
       - name: workspaceId
         in: path
         required: true
         schema:
           type: string
       - name: documentId
         in: path
         required: true
         schema:
           type: string
       - name: versionId
         in: path
         required: true
         schema:
           type: string
    delete:
      tags: [workspaces]
      summary: Delete one version
      description: |-
        Frees a version slot. Deleting the last remaining version is blocked
        (409) — delete the document instead. Surviving versions are never
        renumbered.
      operationId: deleteJsonVersion
      security:
         - bearerAuth: []
      responses:
         '204':
          description: Version deleted
         '401':
           $ref: '#/components/responses/Error401Login'
         '404':
           $ref: '#/components/responses/Error404'
         '409':
           $ref: '#/components/responses/Error409Workspace'

# =======================================================================
# COMPONENTS — SHARED TYPES, RESPONSES, EXAMPLES
# =======================================================================

components:
  schemas:
     # -- Core Domain Models --

    Session:
      type: object
      properties:
        id:
          type: string
          description: UUID of the session
        name:
          type: string
          description: Human-readable session name
        working_json:
          type: object
          additionalProperties: true
          description: Current mutable state (arbitrary user-provided schema)
        versions:
          type: array
          items:
             $ref: '#/components/schemas/VersionSnapshot'
          description: Historical version snapshots
        conversation_history:
          type: array
          items:
             $ref: '#/components/schemas/ChatTurn'
          description: Full chat history for this session
        active_job_id:
          type: string
          nullable: true
          description: Review job that is ready, running or failed (ADR-0026); fetch it with GET .../jobs/{jobId}
        created_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp of session creation
        updated_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp of last update
      required: [id, working_json, versions, conversation_history]

    VersionSnapshot:
      type: object
      properties:
        id:
          type: string
          description: UUID of this version snapshot
        parent_id:
          type: string
          nullable: true
          description: Reference to the predecessor version
        json_data:
          type: object
          additionalProperties: true
          description: The JSON state at time of snapshot
        label:
          type: string
          description: Human-readable label (e.g., "original", "v1 — increase timeout")
        created_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp of creation
      required: [id, json_data, label, created_at]

    ChatTurn:
      type: object
      description: |-
        One stored chat turn. Server-authoritative: replayed to the LLM on the
        next chat call (with diff statuses) so follow-ups resolve.
      properties:
        id:
          type: string
          description: Turn id (uuid hex)
        role:
          type: string
          enum: [user, assistant]
          description: Speaker of the chat turn
        kind:
          type: string
          enum: [message, boundary, job_proposal, job_batch]
          default: message
          description: |-
            boundary = context reset (e.g. version switch); earlier turns are not replayed to the LLM.
            job_proposal = the assistant proposed a batch review job instead of calling the model (see job_proposal).
            job_batch = one finished review batch ("Review batch 3: items 25–36 of 876, 12 changes") with its diffs;
            replayed to the LLM as a single compact progress line.
        content:
          type: string
          description: User text, or the assistant's final explanation
        created_at:
          type: string
          format: date-time
          nullable: true
        diffs:
          type: array
          items:
             $ref: '#/components/schemas/DiffEntry'
          nullable: true
          description: Attached diff entries for assistant turns
        bulk:
          type: array
          nullable: true
          items:
            type: object
            additionalProperties: true
          description: |-
            Bulk ops the model emitted ({path with * wildcards, where, operation,
            new_value}); the server expanded them into `diffs` against the full
            document. Replayed to the model on follow-ups.
        question:
          type: object
          nullable: true
          description: Clarifying question the model asked (ADR-0024); the UI renders options as buttons and a click sends the option as the next message.
          properties:
            text:
              type: string
            options:
              type: array
              maxItems: 4
              items:
                type: string
          required: [text]
        job_proposal:
          nullable: true
          allOf:
             - $ref: '#/components/schemas/JobProposal'
          description: Set on kind=job_proposal turns so the proposal card can be shown again from history.
        job_id:
          type: string
          nullable: true
          description: kind=job_batch — the review job
        batch_no:
          type: integer
          nullable: true
          description: kind=job_batch — 1-based batch number
      required: [role, content]

    JobProposal:
      type: object
      description: |-
        Cost of reviewing a whole document as a batch job (ADR-0026). Computed
        without a model call by the same packing function that sizes the real
        batches: from the AI deployment's per-minute token budget and context
        window and each record's token size — never a fixed record count.
      properties:
        scope_path:
          type: string
          description: JSON Pointer of the collection whose members are reviewed one by one ("" = the document root)
        record_count:
          type: integer
          description: Items to review (members of scope_path plus long text fields outside it)
        batch_count:
          type: integer
          description: Model calls the job needs on the current AI deployment
        est_tokens:
          type: integer
          description: Estimated input tokens over all batches
        eta_s:
          type: integer
          description: Estimated run time in seconds on the current AI deployment
        instruction:
          type: string
          description: What to do with every record (the user's request)
      required: [scope_path, record_count, batch_count, est_tokens, eta_s, instruction]

     # -- Wire Contracts --

    DiffEntry:
      type: object
      properties:
        path:
          type: string
          description: JSON Pointer path to the changed field (e.g., "/services/api/timeout")
        operation:
          type: string
          enum: [add, modify, delete]
          description: Type of change applied
        old_value:
          nullable: true
          description: Value before the change; null for "add" operations
        new_value:
          nullable: true
          description: Value after the change; null for "delete" operations
        id:
          type: string
          description: Unique diff id (backend-generated) used for accept/reject
        status:
          type: string
          enum: [pending, accepted, rejected, failed]
          default: pending
          description: |-
            pending = previewed in working_json; accepted = promoted to baseline;
            rejected = reverted; failed = proposed but did not resolve against the JSON (never applied)
        failure_reason:
          type: string
          nullable: true
          description: Why a failed diff did not apply
        job_id:
          type: string
          nullable: true
          description: Review job that produced this diff (ADR-0026); absent for chat diffs
        batch_no:
          type: integer
          nullable: true
          description: 1-based batch of that job
      required: [path, operation]

    CreateJobRequest:
      type: object
      properties:
        scope_path:
          type: string
          nullable: true
          description: JSON Pointer of the collection to review (from the JobProposal); null = the collection holding most of the document
        instruction:
          type: string
          description: What to do with every record
        source_turn_id:
          type: string
          nullable: true
          description: The job_proposal turn this job was started from
      required: [instruction]

    JobBatch:
      type: object
      description: Summary of one finished batch.
      properties:
        batch_no:
          type: integer
        start:
          type: integer
          description: First item index (0-based)
        end:
          type: integer
          description: Last item index (inclusive)
        diffs:
          type: integer
          description: Changes applied as pending diffs
        failed:
          type: integer
          description: Proposed changes that did not apply
        explanation:
          type: string
      required: [batch_no, start, end, diffs, failed]

    Job:
      type: object
      description: |-
        A client-driven whole-document review (ADR-0026). In memory only.
        ready → running (during /next) → ready … → done; failed when a batch
        fails after the deployment's retries (/next retries it); cancelled
        after DELETE.
      properties:
        id:
          type: string
        status:
          type: string
          enum: [ready, running, done, failed, cancelled]
        scope_path:
          type: string
        instruction:
          type: string
        source_turn_id:
          type: string
          nullable: true
        cursor:
          type: integer
          description: Items fully processed (index of the next item)
        total:
          type: integer
          description: Items in the job
        batches_done:
          type: integer
        batch_count:
          type: integer
          nullable: true
          description: Estimated total batches on the current AI deployment (re-estimated after every batch)
        diffs_pending:
          type: integer
          description: This job's diffs still pending
        eta_s:
          type: integer
          nullable: true
          description: Estimated seconds left
        error:
          type: string
          nullable: true
          description: Why the last batch failed (status failed)
        batches:
          type: array
          items:
             $ref: '#/components/schemas/JobBatch'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, status, scope_path, instruction, cursor, total, batches_done, diffs_pending, batches]

    ValidationError:
      type: object
      properties:
        path:
          type: string
          nullable: true
          description: JSON Pointer to the field that failed validation; null for global errors
        message:
          type: string
          description: Human-readable error description
      required: [message]

    Error:
      type: object
      properties:
        error:
          type: string
          description: Human-readable error message
        hint:
          type: string
          nullable: true
          description: Suggestion for how to resolve the error; null if not applicable
      required: [error]

    QuotaError:
      description: |-
        Structured detail body for 402/429 quota errors. login_available is
        true when the caller is anonymous and logging in would raise their
        free-tier limits (ADR-0015).
      type: object
      properties:
        error:
          type: string
        hint:
          type: string
          nullable: true
        login_available:
          type: boolean
        retry_after:
          type: integer
          nullable: true
          description: Seconds until retry is sensible; null for monthly credit exhaustion
      required: [error, login_available]

    CreditsInfo:
      type: object
      properties:
        monthly_limit:
          type: integer
        used:
          type: number
        remaining:
          type: number
        billing_cycle_start:
          type: string
          format: date-time
      required: [monthly_limit, used, remaining, billing_cycle_start]

    UserProfile:
      type: object
      properties:
        id:
          type: string
          description: Internal user UUID
        email:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        picture:
          type: string
          nullable: true
        plan:
          type: string
          description: Billing plan (free at MVP)
        credits:
           $ref: '#/components/schemas/CreditsInfo'
        per_minute_token_limit:
          type: integer
      required: [id, plan, credits, per_minute_token_limit]

     # -- Request/Response Wrappers --

    CreateSessionRequest:
      type: object
      properties:
        name:
          type: string
          description: Human-readable session name
      required: [name]

    SessionResponse:
      allOf:
         - $ref: '#/components/schemas/Session'
         - type: object
           properties:
             starter_prompts:
               type: array
               items:
                 type: string
               description: |-
                 Transient starter prompts, only populated by
                 POST /api/sessions/from-template for the studio chip UI.
      description: Full session state returned by GET /api/sessions/{id} and POST /api/sessions

    SeedFromTemplateRequest:
      type: object
      properties:
        templateSlug:
          type: string
          maxLength: 200
          description: Slug of the static template being opened
        templateTitle:
          type: string
          nullable: true
          description: Human-readable template title (used as the session name)
        json:
          type: object
          additionalProperties: true
          description: The template JSON to seed as working_json
        starterPrompts:
          type: array
          maxItems: 8
          items:
            type: string
          description: Prompts surfaced as clickable chips in the studio
      required: [templateSlug, json]

    CreateVersionRequest:
      type: object
      properties:
        label:
          type: string
          description: Human-readable version label
        json_data:
          type: object
          additionalProperties: true
          description: JSON state to snapshot
      required: [label, json_data]

    SelectVersionRequest:
      type: object
      properties:
        versionId:
          type: string
          description: ID of the version snapshot to load
      required: [versionId]

    RestoreVersionsRequest:
      type: object
      properties:
        versions:
          type: array
          items:
             $ref: '#/components/schemas/VersionSnapshot'
          maxItems: 100
          description: Snapshots to restore verbatim (ids/labels/timestamps preserved)
        working_json:
          type: object
          additionalProperties: true
          nullable: true
          description: Working JSON to restore (unsaved work from the browser cache)
        baseline_json:
          type: object
          additionalProperties: true
          nullable: true
          description: Baseline JSON to restore; defaults to working_json when omitted
        active_version_id:
          type: string
          nullable: true
          description: Previously active version id; ignored if not among restored versions
        conversation_history:
          type: array
          nullable: true
          items:
             $ref: '#/components/schemas/ChatTurn'
          description: Mirrored chat thread with diff statuses (capped server-side). The only path where client-held history enters the server.
      required: [versions]

    ChatRequest:
      type: object
      properties:
        session_id:
          type: string
          description: UUID of the session to send a message in
        working_json:
          type: object
          additionalProperties: true
          description: Current working JSON sent to the LLM as context every turn
        message:
          type: string
          description: User's natural language modification request
        focus_path:
          type: string
          description: |-
            Optional JSON Pointer (e.g. "/settings"). The model sees and edits
            only this subtree; diff paths are returned against the full
            document. Used after an input_too_large event (ADR-0025).
          example: "/settings"
      required: [session_id, working_json, message]

    UploadResponse:
      type: object
      properties:
        session_id:
          type: string
          description: UUID of the created or retrieved session
        parsed_json:
          type: object
          additionalProperties: true
          description: The parsed JSON tree from the uploaded file
        schema_summary:
           $ref: '#/components/schemas/SchemaSummary'
      required: [session_id, parsed_json]

    SchemaSummary:
      type: object
      properties:
        top_level_keys:
          type: array
          items:
            type: string
          description: Top-level keys in the JSON structure
        nested_depth:
          type: integer
          minimum: 0
          description: Maximum nesting depth of the JSON
        array_lengths:
          type: object
          additionalProperties:
            type: integer
          description: 'Array lengths keyed by path (e.g., "/services": 3)'
      required: [top_level_keys, nested_depth]

    ValidateRequest:
      type: object
      properties:
        json_data:
          type: object
          additionalProperties: true
          description: JSON document to validate
      required: [json_data]

    ValidateResponse:
      type: object
      properties:
        valid:
          type: boolean
          description: Whether the JSON passes all validation rules
        errors:
          type: array
          items:
             $ref: '#/components/schemas/ValidationError'
          description: List of validation error messages; empty if valid
      required: [valid, errors]

    DiffAcceptResponse:
      type: object
      properties:
        success:
          type: boolean
        working_json:
          type: object
          additionalProperties: true
        validation_passed:
          type: boolean
          description: Whether the post-acceptance validation passed
      required: [success, working_json]

    DiffRejectResponse:
      type: object
      properties:
        success:
          type: boolean
        working_json:
          type: object
          additionalProperties: true
      required: [success, working_json]

     # -- Workspaces (ADR-0018) --

    WorkspaceSummary:
      type: object
      properties:
        id:
          type: string
          description: UUID of the workspace
        name:
          type: string
          description: User-given name, unique per user
        is_default:
          type: boolean
          description: Exactly one default workspace per user; not deletable
        document_count:
          type: integer
          description: Number of JSON documents currently in the workspace
        updated_at:
          type: string
          format: date-time
      required: [id, name, is_default, document_count, updated_at]

    CreateWorkspaceRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          description: Workspace name, unique per user
      required: [name]

    RenameJsonRequest:
      type: object
      properties:
        tag:
          type: string
          maxLength: 100
          description: New tag, unique within the workspace
      required: [tag]

    JsonDocumentSummary:
      type: object
      properties:
        id:
          type: string
          description: UUID of the document
        tag:
          type: string
          description: User-given identifier, unique within the workspace
        version_count:
          type: integer
        latest_version_number:
          type: integer
          description: Highest version_number; the version loaded for work
        updated_at:
          type: string
          format: date-time
      required: [id, tag, version_count, latest_version_number, updated_at]

    WorkspaceJsonVersion:
      type: object
      properties:
        id:
          type: string
          description: UUID of the version
        version_number:
          type: integer
          description: Monotonic per document, server-assigned, never reused
        label:
          type: string
          description: Optional user-given label
        content:
          type: object
          additionalProperties: true
          description: Full JSON snapshot
        created_at:
          type: string
          format: date-time
      required: [id, version_number, content, created_at]

    JsonDocumentDetail:
      type: object
      properties:
        id:
          type: string
        tag:
          type: string
        versions:
          type: array
          items:
             $ref: '#/components/schemas/WorkspaceJsonVersion'
          description: Ordered by version_number ascending
      required: [id, tag, versions]

    NewVersionPayload:
      type: object
      properties:
        label:
          type: string
          description: Optional label for the snapshot
        content:
          type: object
          additionalProperties: true
          description: Full JSON snapshot to persist
      required: [content]

    SaveJsonRequest:
      type: object
      properties:
        tag:
          type: string
          maxLength: 100
          description: Tag for the new document, unique within the workspace
        versions:
          type: array
          items:
             $ref: '#/components/schemas/NewVersionPayload'
          minItems: 1
          maxItems: 5
          description: Snapshots to persist, oldest first
      required: [tag, versions]

    AppendVersionsRequest:
      type: object
      properties:
        versions:
          type: array
          items:
             $ref: '#/components/schemas/NewVersionPayload'
          minItems: 1
          description: Not-yet-persisted snapshots, oldest first
      required: [versions]

    WorkspaceConflictDetail:
      type: object
      description: |-
        Structured 409 detail for workspace writes. Either a blocked limit
        (error=limit_exceeded, limit_type jsons|versions) or a UNIQUE
        violation (error=duplicate, field name|tag).
      properties:
        error:
          type: string
          enum: [limit_exceeded, duplicate]
        limit_type:
          type: string
          enum: [jsons, versions]
        limit:
          type: integer
        field:
          type: string
          enum: [name, tag]
      required: [error]

    LoginRequiredError:
      type: object
      properties:
        message:
          type: string
        login_available:
          type: boolean
          description: Always true — the frontend shows the login CTA popup
      required: [message, login_available]

     # -- HTTP Error Response Templates --

  responses:
    Error400:
      description: Bad request — invalid input format or missing required fields
      content:
        application/json:
          schema:
             $ref: '#/components/schemas/Error'
          example:
            error: "Invalid request body"
            hint: "Check your JSON syntax and required fields."

    Error401:
      description: Unauthorized — missing or invalid API key in X-API-Key header
      content:
        application/json:
          schema:
             $ref: '#/components/schemas/Error'
          example:
            error: "Missing or invalid API key. Send valid X-API-Key header."
            hint: null

    Error404:
      description: Not found — session does not exist
      content:
        application/json:
          schema:
             $ref: '#/components/schemas/Error'
          example:
            error: "Session not found"
            hint: "Check the session ID and try again."

    Error409:
      description: Conflict — session already contains version snapshots
      content:
        application/json:
          schema:
             $ref: '#/components/schemas/Error'
          example:
            error: "Session already has versions"
            hint: "Restore is only allowed into a session with no versions."

    Error402:
      description: |-
        Payment required — monthly credit quota exhausted. Anonymous callers
        can log in for their own free-tier quota (login_available true).
      content:
        application/json:
          schema:
             $ref: '#/components/schemas/QuotaError'
          example:
            error: "Insufficient credits"
            hint: "Log in to get your own free monthly quota."
            login_available: true
            retry_after: null

    Error429:
      description: |-
        Too many requests — request-rate or per-minute token limit exceeded.
        Anonymous: 10 req/min per browser key. Logged-in: 30 req/min.
        Carries Retry-After header.
      content:
        application/json:
          schema:
             $ref: '#/components/schemas/QuotaError'
          example:
            error: "Rate limit reached: 10 requests per 60s. Please try again in a moment."
            hint: null
            login_available: true
            retry_after: 60

    Error401Login:
      description: |-
        Unauthorized — workspace routes require an Auth0 bearer token.
        login_available true drives the frontend login CTA popup.
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                 $ref: '#/components/schemas/LoginRequiredError'
          example:
            detail:
              message: "Login required to use workspaces."
              login_available: true

    Error409Workspace:
      description: |-
        Conflict — a workspace limit blocks the write (never evicted), a
        name/tag is taken, the default workspace was targeted for delete,
        or the last remaining version was targeted for delete.
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                oneOf:
                   - $ref: '#/components/schemas/WorkspaceConflictDetail'
                   - type: string
          example:
            detail:
              error: "limit_exceeded"
              limit_type: "jsons"
              limit: 5

    Error503:
      description: Service unavailable — database not configured (anonymous-only mode)
      content:
        application/json:
          schema:
             $ref: '#/components/schemas/Error'
          example:
            error: "Workspaces are temporarily unavailable (database not configured)."
            hint: null

    Error500:
      description: Internal server error — LLM call failed or unexpected error
      content:
        application/json:
          schema:
             $ref: '#/components/schemas/Error'
          example:
            error: "LLM call failed: timeout after 5000ms"
            hint: "Please try again."
