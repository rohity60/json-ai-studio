# Deployment registry — per-deployment tunables only (ADR-0016).
# Endpoints, credentials, litellm prefixes, and pricing live in the
# matching provider class: src/json_ai_studio/providers/<name>.py.
# Secrets/endpoint overrides resolve via pydantic Settings (settings.py):
#   google_ai_studio -> GOOGLE_AI_STUDIO_API_KEY  (missing key disables)
#   nvidia_nim       -> NVIDIA_NIM_API_KEY        (missing key disables)
#   openrouter       -> OPENROUTER_API_KEY        (missing key disables)
#   ollama_local     -> OLLAMA_BASE_URL (required; unset disables the
#                       deployment), e.g. http://localhost:11434
#
# base_model: model used when a request names no model (default traffic);
# enabled deployments' base models are round-robined per request.
#
# reasoning: generic level ("none" | "minimal" | "low" | "medium" | "high").
# Each provider translates it to its backend's params — OpenAI-style
# reasoning_effort by default; Google maps it to
# generationConfig.thinkingConfig.thinkingLevel (Gemma 4 requires one).
# Omit the key to send no reasoning params at all.
#
# supports_thinking: whether this backend honors the UI thinking on/off
# override. false = ignore the override (never send a reasoning param the
# backend rejects — e.g. OpenRouter's free Gemma 400s on reasoning_effort).
# The `reasoning` default above still applies regardless of this flag.
#
# supports_tools: backend handles native function calling through LiteLLM
# (ADR-0024). Enables the read-only search/read lookup loop for documents too
# large to inline. ollama gemma4:12b verified with a live tool call;
# google_ai_studio gemma-4-26b verified non-streaming (2026-10-23).
#
# tool_streaming (default true): stream tool rounds; set false only where
# streamed tool calls are proven broken. Verified streamed: ollama gemma4:12b.
#
# tpm_input_limit (ADR-0025): provider input tokens per minute, per model.
# The turn planner sizes prompts and tool rounds to fit it, and the gateway
# counter waits or rejects before the provider would 429. Omit = no limit.
# context_tokens: model input window when LiteLLM does not know it.
# min_call_interval_s: minimum spacing between LLM call starts on this
# deployment, across all users and tool rounds (each waits for its slot,
# countdown shown). Omit = no pacing.
# policy (PRD B B-19): provider facts and safety caps for this deployment;
# any key left out uses the Settings default (env-overridable):
#   budget_headroom             fraction of tpm_input_limit planned/gated (0.8)
#   window_margin_s             calls count 60 s + this after they finish (0)
#   transient_fast_s            a 5xx within this many s is a hiccup (3)
#   transient_retry_attempts    hiccup retries per call (1)
#   transient_retry_turn_max    hiccup retries per turn (2)
#   transient_retry_wait_s      wait × attempt before a retry (3)
#   transient_retry_schedule_s  explicit waits before retry 1, 2, 3… (list;
#                               overrides wait × attempt; last repeats)
#   rate_limit_retry_attempts   429 retries per call, hint required (0)
#   rate_limit_retry_max_wait_s longer provider hints → fail (10)
# Retries always wait for their pacing slot and token budget; failed calls
# stay counted (Google counts them).

deployments:
  # Disabled 2026-11-12: nvidia_nim (Nemotron) is the default now — better
  # answers on large docs, no 16k tokens/min cap, none of the free tier's
  # bursts of fast 500s (see policy below).
  # Re-enable as the fallback once gateway failover exists.
  google_ai_studio:
    enabled: false
    base_model: "gemma-4-26b-a4b-it"
    reasoning: "minimal"
    supports_thinking: true
    supports_tools: true
    # Streamed tool rounds fail mid-stream here (MidStreamFallbackError →
    # 500/429 on most first attempts, 2026-10-30); non-streaming tool calls
    # were the verified mode (ADR-0024).
    tool_streaming: false
    # Free tier: generate_content_free_tier_input_token_count = 16000/min.
    tpm_input_limit: 16000
    # ~4k input tokens per skeleton call → ~4 calls/min fit: one every 15 s.
    min_call_interval_s: 15
    policy:
      # Soft cap: 500s near the stated 16k (ADR-0025).
      budget_headroom: 0.8
      # Skew on top of finish-time stamping (500s at our window edge).
      window_margin_s: 4
      # Free tier answers ~40 % of calls with a fast 500, in bursts; one
      # live turn needed 7 paced retries (2026-11-11).
      transient_retry_attempts: 3
      transient_retry_turn_max: 12
      # Bursts of 500s last minutes: retries 3/6/9 s apart (all inside one
      # 45 s span with 15 s pacing) failed together in prod 2026-11-11
      # 16:23. Spread them so the last retry lands ~1.5–2 min later.
      transient_retry_schedule_s: [10, 30, 60]
    models:
        - "gemma-4-26b-a4b-it"

  # Default deployment since 2026-11-12 (Nemotron 3.5 Super). Needs
  # NVIDIA_NIM_API_KEY in the environment — a missing key disables it, and
  # with google_ai_studio off that leaves NO deployment for chat.
  nvidia_nim:
    enabled: true
    base_model: "nvidia/nemotron-3.5-super-vl-120b-a12b"
    reasoning: "none"
    supports_thinking: true
    # Nemotron tool calls verified 2026-11-12: streamed + non-streamed, with
    # thinking on and off (search tool, <1 s per call).
    supports_tools: true
    # Streamed tool rounds verified with Nemotron (unlike Google, above).
    tool_streaming: true
    # tpm_input_limit: omitted on purpose — none found. NIM documents no
    # input-token cap, and an escalating probe (2026-11-12, unique prompts,
    # no prefix caching) reached 14.4M input tokens/min (16 concurrent
    # 300k-token calls, 100 calls, 0 errors, no rate-limit headers). Latency
    # is the real cost: ~5 s at 75k tokens, ~22 s at 300k, flat under
    # concurrency. policy.budget_headroom / window_margin_s only apply with a
    # limit, so they are not set either. Pacing below is by call count.
    # LiteLLM has no model-info entry for Nemotron. The model card lists a
    # 262K context; NIM's endpoint accepts up to 1M ("maximum context length
    # is 1000000 tokens", a 300k-token prompt answered in 24 s, 2026-11-12),
    # but quality past the card's figure is unvalidated, so plan to 262K.
    # Inline vs skeleton is decided by LLM_MAX_INLINE_CHARS (~49k tokens),
    # not by this; it caps the skeleton's first call (else input_too_large).
    context_tokens: 262144
    # Free trial key: NVIDIA publishes no fixed number (varies by model and
    # load; see your build.nvidia.com account); 40 RPM is the widely
    # reported cap. Not enforced in a probe (180 calls in ~1 min, all 200,
    # no rate-limit headers), so pace to the documented 40/min anyway.
    min_call_interval_s: 1.5
    policy:
      # NIM 5xx / 429 behaviour not yet observed (0 errors in ~200 probe
      # calls); moderate values, tune from prod logs like Google's.
      # A fast 5xx (< 3 s) is a hiccup: retry twice per call, 4 per turn.
      transient_fast_s: 3
      transient_retry_attempts: 2
      transient_retry_turn_max: 4
      transient_retry_schedule_s: [3, 10]
      # 429: retry once only when NIM sends a Retry-After of <= 10 s.
      rate_limit_retry_attempts: 1
      rate_limit_retry_max_wait_s: 10
    models:
        - "nvidia/nemotron-3.5-super-vl-120b-a12b"
        - "google/gemma-4-31b-it"

  # Disabled 2026-10-18: the shared free pool for this model 429s on most
  # calls (upstream_provider_shared_pool), so round-robin failed roughly
  # every other chat request in prod. Re-enable with a BYOK/paid key or once
  # gateway failover exists.
  openrouter:
    enabled: false
    base_model: "google/gemma-4-26b-a4b-it:free"
    reasoning: "none"
    supports_thinking: false
    # OpenRouter's models API lists tools/tool_choice for this model, but the
    # live probe 2026-10-24 hit 429s (free shared pool). Set true once
    # re-enabled on a paid/BYOK route and one live tool call succeeds.
    supports_tools: false
    models:
        - "google/gemma-4-26b-a4b-it:free"

  ollama_local:
    enabled: false
    base_model: "gemma4:12b"
    reasoning: "none"
    supports_thinking: false
    supports_tools: true
    policy:
      # Local: a 5xx means the model server is down/broken — don't retry.
      transient_retry_attempts: 0
    models:
        - "qwen3.6:35b-mlx"
        - "gemma4:12b"

  # Anna App runtime only (ADR-0028): served through the Anna host by the
  # Executa's litellm custom provider. Stays disabled unless ANNA_ENABLED is
  # true, whatever `enabled` says here.
  anna:
    enabled: true
    # The Anna user's own default model; the host picks it.
    base_model: "default"
    reasoning: "none"
    supports_thinking: true
    # Anna caps one tool invoke at 8 LLM calls and 32k tokens in total, so
    # a multi-round lookup loop cannot fit: no tools. Large documents use
    # the skeleton prompt or the too-large -> focus_path flow instead.
    supports_tools: false
    # Budget for the single call of a turn: 24k input x 0.8 headroom,
    # leaving room for the 8,192-token output cap inside the 32k total.
    # The Executa resets the per-minute window at the start of each turn
    # (the cap is per invoke, not per minute).
    tpm_input_limit: 24000
    context_tokens: 32000
    policy:
      # Host errors are quota or platform faults: do not retry.
      transient_retry_attempts: 0
    models:
        - "default"
