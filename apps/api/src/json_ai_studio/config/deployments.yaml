# Deployment registry — per-deployment tunables only (ADR-0016).
# Endpoints, credentials, litellm prefixes, and pricing live in the
# matching provider class: src/json_ai_studio/providers/<name>.py.
# Secrets/endpoint overrides resolve via pydantic Settings (settings.py):
#   google_ai_studio -> GOOGLE_AI_STUDIO_API_KEY  (missing key disables)
#   nvidia_nim       -> NVIDIA_NIM_API_KEY        (missing key disables)
#   openrouter       -> OPENROUTER_API_KEY        (missing key disables)
#   ollama_local     -> OLLAMA_BASE_URL (required; unset disables the
#                       deployment), e.g. http://localhost:11434
#
# base_model: model used when a request names no model (default traffic);
# enabled deployments' base models are round-robined per request.
#
# reasoning: generic level ("none" | "minimal" | "low" | "medium" | "high").
# Each provider translates it to its backend's params — OpenAI-style
# reasoning_effort by default; Google maps it to
# generationConfig.thinkingConfig.thinkingLevel (Gemma 4 requires one).
# Omit the key to send no reasoning params at all.
#
# supports_thinking: whether this backend honors the UI thinking on/off
# override. false = ignore the override (never send a reasoning param the
# backend rejects — e.g. OpenRouter's free Gemma 400s on reasoning_effort).
# The `reasoning` default above still applies regardless of this flag.

deployments:
  google_ai_studio:
    enabled: true
    base_model: "gemma-4-26b-a4b-it"
    reasoning: "minimal"
    supports_thinking: true
    models:
        - "gemma-4-26b-a4b-it"

  nvidia_nim:
    enabled: false
    base_model: "google/gemma-4-31b-it"
    reasoning: "none"
    supports_thinking: true
    models:
        - "google/gemma-4-31b-it"

  openrouter:
    enabled: true
    base_model: "google/gemma-4-26b-a4b-it:free"
    reasoning: "none"
    supports_thinking: false
    models:
        - "google/gemma-4-26b-a4b-it:free"

  ollama_local:
    enabled: false
    base_model: "gemma4:12b"
    reasoning: "none"
    supports_thinking: false
    models:
        - "qwen3.6:35b-mlx"
        - "gemma4:12b"
