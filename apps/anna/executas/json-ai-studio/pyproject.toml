[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-json-ai-studio-json-ai-studio-nk262zbg"
version = "0.1.0"
description = "Executa for the JSON AI Studio Anna App"
requires-python = ">=3.12"
dependencies = [
    "json-ai-studio-api",
]

[project.scripts]
"tool-json-ai-studio-json-ai-studio-nk262zbg" = "json_ai_studio_plugin:main"

[tool.setuptools]
py-modules = ["json_ai_studio_plugin"]
packages = ["jstudio"]

[tool.uv.sources]
# The shared core (gateway, planner, diff engine) lives in the API package.
json-ai-studio-api = { path = "../../../api", editable = true }

[tool.uv]
# Keep in step with apps/api/uv.lock: the engine is tested against this
# litellm, and newer releases roughly double the binary size.
constraint-dependencies = ["litellm==1.89.3"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
